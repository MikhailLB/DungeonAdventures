name: dungeon_adventures
description: "Chicken Way Go - a hand-crafted dungeon puzzle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── White part (existing) ─────────────────────────────────
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/assets/logo.png"
  adaptive_icon_foreground: "assets/assets/logo.png"
  adaptive_icon_background: "#0A0D15"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

# Disable SPM — Firebase managed via CocoaPods to prevent module conflicts.
flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  assets:
    - assets/assets/
    - assets/loading/
    - assets/Notifications/
    - assets/NoWifi/
