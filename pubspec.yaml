name: dungeon_adventures
description: "Cart Lock - a hand-crafted dungeon logic puzzle."
publish_to: 'none'

version: 1.0.2+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── White part (existing) ─────────────────────────────────
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  # ── Loading splash video ──────────────────────────────────
  video_player: ^2.11.1

  # ── Gray hub layer ────────────────────────────────────────
  # Version numbers are intentionally bumped from the sibling project
  # (LavaPeakRun) to differentiate the binary fingerprint.
  appsflyer_sdk: ^6.18.0
  app_tracking_transparency: ^2.0.7
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_app_check: ^0.4.4+2
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^7.1.1
  http: ^1.6.0
  device_info_plus: ^13.1.0
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^10.1.0
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  file_picker: ^3.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/assets/logo.webp"
  adaptive_icon_foreground: "assets/assets/logo.webp"
  adaptive_icon_background: "#0A0D15"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

# Disable SPM — Firebase managed via CocoaPods to prevent module conflicts.
flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  assets:
    - assets/title.webp
    - assets/assets/
    - assets/loading/
    - assets/Notifications/
    - assets/NoWifi/
